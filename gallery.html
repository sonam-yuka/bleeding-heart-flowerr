<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Bleeding Heart Flower Gallery</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff0f5;
      margin: 0;
      text-align: center;
      padding-bottom: 50px; /* Added padding so the button isn't at the very edge */
    }

    nav {
      background-color: #ff4d88;
      padding: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    h1 {
      color: #cc0066;
      margin: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* BUTTON STYLING */
    .btn-container {
      margin-top: 30px;
    }

    .more-info-btn {
      display: inline-block;
      background-color: #cc0066;
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px; /* Rounded pill shape */
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .more-info-btn:hover {
      background-color: #ff4d88;
      transform: scale(1.1);
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="care.html">Care</a>
    <a href="meaning.html">Meaning</a>
    <a href="gallery.html">Gallery</a>
  </nav>

  <h1>Bleeding Heart Flower Gallery</h1>

  <div class="gallery">
    <img src="image/bleeding.jpg" alt="Bleeding Heart Flower">
    <img src="image/images (1).jpg" alt="Bleeding Heart Flower">
    <img src="image/images.jpg" alt="Bleeding Heart Flower">
    <img src="image/heart.jpg" alt="Bleeding Heart Flower">
    <img src="image/flower.jpg" alt="Bleeding Heart Flower">
    <img src="image/BH.avif" alt="Bleeding Heart Flower">
    <img src="image/images.jpg" alt="Bleeding Heart Flower">
    <img src="image/images (2).jpg" alt="Bleeding Heart Flower">
  </div>

  <div class="btn-container">
    <a href="https://en.wikipedia.org/wiki/Lamprocapnos" target="_blank" class="more-info-btn">
      Click me to learn more
    </a>
  </div>

</body>

</html>
