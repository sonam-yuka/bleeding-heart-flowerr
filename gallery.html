<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Bleeding Heart Flower Gallery</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff0f5;
      margin: 0;
      text-align: center;
    }

    nav {
      background-color: #ff4d88;
      padding: 15px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    h1 {
      color: #cc0066;
      margin: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
